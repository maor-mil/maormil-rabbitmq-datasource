# TLS listeners for the local/E2E broker (certificates from docker/rabbitmq/tls/generate-certs.sh).
listeners.ssl.default = 5671
stream.listeners.ssl.default = 5551

ssl_options.cacertfile = /etc/rabbitmq/tls/ca.pem
ssl_options.certfile   = /etc/rabbitmq/tls/server.pem
ssl_options.keyfile    = /etc/rabbitmq/tls/server-key.pem
# Ask for a client certificate (mTLS) but also accept TLS clients without one.
ssl_options.verify               = verify_peer
ssl_options.fail_if_no_peer_cert = false

# EXTERNAL = authenticate with the client certificate; the user name is the certificate's CN.
auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = AMQPLAIN
auth_mechanisms.3 = EXTERNAL
ssl_cert_login_from = common_name
