# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
# Push a tag matching the package.json version (e.g. v2.0.0) to create a draft GitHub release with the signed plugin.
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          # Grafana access policy token used to sign the plugin.
          # https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token
          policy_token: ${{ secrets.POLICY_TOKEN }}
          # The action defaults (Go 1.25, Node 20) are older than this plugin requires.
          go-version: '1.26'
          node-version: '24'
